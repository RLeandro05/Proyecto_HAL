<div class="container mt-5">
    <h2 class="text-center mb-4">Gráficos Estadísticos</h2>
  
    <div class="row justify-content-center">
      <!-- Gráfico de Barras -->
      <div class="col-12 col-md-6 mb-4">
        <div class="card shadow">
          <div class="card-body">
            <h5 class="card-title text-center">Gráfico de Barras</h5>
            <!-- Canvas para el gráfico de barras -->
            <canvas id="barChart" width="400" height="200"></canvas>
          </div>
        </div>
      </div>
  
      <!-- Gráfico de Líneas -->
      <div class="col-12 col-md-6 mb-4">
        <div class="card shadow">
          <div class="card-body">
            <h5 class="card-title text-center">Gráfico de Líneas</h5>
            <!-- Canvas para el gráfico de líneas -->
            <canvas id="lineChart" width="400" height="200"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
